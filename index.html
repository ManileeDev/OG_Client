<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OG Clothing — Menswear</title>
    <script>
      // Apply saved theme before first paint to avoid a flash.
      // ?theme=light|dark in the URL overrides and persists.
      const forced = new URLSearchParams(location.search).get('theme')
      if (forced === 'light' || forced === 'dark') {
        localStorage.setItem('og-theme', forced)
      }
      if (localStorage.getItem('og-theme') === 'light') {
        document.documentElement.classList.add('light')
      }
      // Colour palette: 'default' (olive) or 'mono' (black & white).
      // ?palette=default|mono in the URL overrides and persists.
      const forcedPalette = new URLSearchParams(location.search).get('palette')
      if (forcedPalette === 'default' || forcedPalette === 'mono') {
        localStorage.setItem('og-palette', forcedPalette)
      }
      if (localStorage.getItem('og-palette') === 'mono') {
        document.documentElement.classList.add('mono')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
